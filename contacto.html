<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos | Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body>
    <header>
        <h1>Veterinaria San Marcos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Servicios</a>
            <a href="contacto.html" class="activo">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Agenda tu cita</h2>
            <p>Déjanos tus datos y el motivo de consulta. Te contactaremos a la brevedad.</p>
            
            <form id="formularioContacto">
                <label for="nombre">Nombre del dueño:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">

                <label for="mascota">Nombre de la mascota:</label>
                <input type="text" id="mascota" name="mascota" placeholder="Ej. Firulais">

                <!-- NUEVO CAMPO: CORREO ELECTRÓNICO -->
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ej. jperez@correo.cl">

                <label for="motivo">Motivo de la consulta:</label>
                <textarea id="motivo" name="motivo" rows="4" placeholder="Describe brevemente el síntoma o servicio que necesitas..."></textarea>

                <p id="mensajeError" class="error"></p>
                
                <button type="submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Veterinaria San Marcos.</p>
    </footer>
</body>
</html>
