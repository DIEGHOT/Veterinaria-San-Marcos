<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos | Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body>
    <header>
        <h1>Veterinaria San Marcos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Servicios</a>
            <a href="contacto.html" class="activo">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <!-- Creado por Diego Sansana: Estructura inicial del formulario -->
            <h2>Agenda tu cita</h2>
            <p>Déjanos tus datos y el motivo de consulta. Te contactaremos a la brevedad.</p>

            <!-- MODIFICADO POR BENJAMÍN ROJAS: Se agregó 'novalidate' para controlar validaciones por JS -->
            <form id="formularioContacto" novalidate>

                <label for="nombre">Nombre del dueño:</label>
                <!-- MODIFICADO POR BENJAMÍN ROJAS: Agregadas validaciones (required, minlength, pattern), autocomplete y ARIA -->
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej. Juan Pérez"
                    autocomplete="name"
                    required
                    minlength="3"
                    pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$"
                    aria-describedby="errorNombre">
                <!-- AGREGADO POR BENJAMÍN ROJAS: Mensaje de error específico -->
                <p id="errorNombre" class="error" aria-live="polite"></p>

                <label for="mascota">Nombre de la mascota:</label>
                <!-- MODIFICADO POR BENJAMÍN ROJAS: Agregadas validaciones y ARIA -->
                <input
                    type="text"
                    id="mascota"
                    name="mascota"
                    placeholder="Ej. Firulais"
                    autocomplete="off"
                    required
                    minlength="2"
                    pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\s]+$"
                    aria-describedby="errorMascota">
                <p id="errorMascota" class="error" aria-live="polite"></p>

                <label for="correo">Correo electrónico:</label>
                <!-- MODIFICADO POR BENJAMÍN ROJAS: Agregadas validaciones y ARIA -->
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ej. juan.perez@correo.com"
                    autocomplete="email"
                    required
                    aria-describedby="errorCorreo">
                <p id="errorCorreo" class="error" aria-live="polite"></p>

                <!-- AGREGADO POR BENJAMÍN ROJAS: Nuevo campo completo para el Teléfono -->
                <label for="telefono">Teléfono de contacto:</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej. +56 9 1234 5678"
                    autocomplete="tel"
                    required
                    pattern="^[0-9+\s]{8,15}$"
                    aria-describedby="errorTelefono">
                <p id="errorTelefono" class="error" aria-live="polite"></p>

                <!-- MODIFICADO POR BENJAMÍN ROJAS: El motivo ahora usa un <datalist> con opciones -->
                <label for="motivo">Motivo de la consulta:</label>
                <input
                    type="text"
                    id="motivo"
                    name="motivo"
                    list="sugerenciasMotivo"
                    placeholder="Escribe o elige una sugerencia"
                    autocomplete="off"
                    required
                    minlength="5"
                    aria-describedby="errorMotivo">
                
                <!-- Sugerencias (datalist) para el campo motivo -->
                <datalist id="sugerenciasMotivo">
                    <option value="Consulta general">
                    <option value="Plan de vacunación">
                    <option value="Peluquería y estética">
                    <option value="Exámenes de laboratorio">
                    <option value="Cirugía menor">
                    <option value="Urgencia">
                </datalist>
                <p id="errorMotivo" class="error" aria-live="polite"></p>

                <!-- AGREGADO POR BENJAMÍN ROJAS: Nueva área de texto para detalles adicionales -->
                <label for="detalle">Detalle adicional (opcional):</label>
                <textarea
                    id="detalle"
                    name="detalle"
                    rows="4"
                    placeholder="Describe brevemente el síntoma o cualquier información relevante..."></textarea>

                <!-- Creado por Diego Sansana (originalmente "mensajeError"), adaptado por Benjamín -->
                <p id="mensajeGlobal" class="error" aria-live="polite"></p>

                <button type="submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Veterinaria San Marcos.</p>
    </footer>
</body>
</html>
